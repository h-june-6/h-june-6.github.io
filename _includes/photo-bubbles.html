<!-- 홈 배경: 활동 사진 버블 (사진 목록은 _data/bubbles.yml) -->
{%- assign bubbles = site.data.bubbles -%}
{%- if bubbles and bubbles.size > 0 -%}
<section id="photo-bubbles" aria-label="활동 사진">
  {%- for b in bubbles -%}
    {%- capture src -%}{% include media-url.html src=b.src %}{%- endcapture -%}
    <figure class="bubble" data-diameter="{{ b.diameter }}">
      <img src="{{ src | strip }}" alt="{{ b.caption | default: '활동 사진' | escape }}" loading="eager" onerror="this.closest('.bubble').remove()">
      {%- if b.caption -%}<figcaption>{{ b.caption }}</figcaption>{%- endif -%}
    </figure>
  {%- endfor -%}
</section>

<style>
  /* 버블 층: 사이드바 오른쪽, 상단바 아래의 화면 전체를 씀 */
  #photo-bubbles {
    position: fixed;
    top: 3rem;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  /* 글 목록·상단바·오른쪽 패널만 버블 위에, 푸터 글씨는 버블 뒤로 */
  body.has-bubbles #topbar-wrapper,
  body.has-bubbles #post-list,
  body.has-bubbles .pagination { position: relative; z-index: 1; }
  body.has-bubbles #panel-wrapper { z-index: 1; }

  /* 젖빛 유리 카드: 뒤로 지나가는 버블이 흐릿하게 비침 */
  body.has-bubbles #post-list .post-preview,
  body.has-bubbles #panel-wrapper .access > section {
    background: color-mix(in srgb, var(--card-bg) 70%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    backdrop-filter: blur(18px) saturate(1.25);
  }
  body.has-bubbles #panel-wrapper .access > section { border-radius: 0.75rem; padding: 0.5rem 0.75rem; }

  #photo-bubbles .bubble {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    border-radius: 50%;
    pointer-events: auto;
    cursor: pointer;
    will-change: transform;
    opacity: 0;
  }
  /* 사진이 다 불러와진 뒤에 부드럽게 나타나기 */
  #photo-bubbles .bubble.ready { opacity: 1; transition: opacity 0.5s ease, box-shadow 0.3s ease; }
  #photo-bubbles .preview-img,
  #photo-bubbles .shimmer {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    background: none !important;
    border-radius: 50%;
    overflow: hidden;
    -webkit-clip-path: circle(50% at 50% 50%);
    clip-path: circle(50% at 50% 50%);
  }
  #photo-bubbles .shimmer::before { display: none !important; }
  #photo-bubbles .bubble img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
    -webkit-clip-path: circle(50% at 50% 50%);
    clip-path: circle(50% at 50% 50%);
  }
  /* 물방울 그림자: 아래로 옅게 */
  #photo-bubbles .bubble {
    box-shadow: 0 18px 32px -18px rgba(30, 60, 110, 0.35);
  }
  /* 사진: 색감을 살짝 바래게, 물속에 비친 것처럼 */
  #photo-bubbles .bubble > .preview-img { position: relative; z-index: 1; }
  #photo-bubbles .bubble img {
    filter: saturate(0.75) brightness(0.9) contrast(0.95);
    opacity: 1;
    transform: scale(1.06);
    transition: filter 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
  }
  /* 물방울 표면: 광택 + 렌즈처럼 밝은 가장자리 */
  #photo-bubbles .bubble::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 24% 13% at 33% 19%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0) 70%),
      radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 10%),
      radial-gradient(circle closest-side, rgba(255, 255, 255, 0) 74%, rgba(190, 215, 245, 0.1) 90%, rgba(255, 255, 255, 0.22) 100%);
    box-shadow:
      inset 0 -14px 28px rgba(40, 90, 160, 0.22),
      inset 0 10px 22px rgba(255, 255, 255, 0.15),
      0 0 0 1px rgba(255, 255, 255, 0.6);
  }
  #photo-bubbles .bubble:hover { z-index: 5; }
  /* 마우스를 올리면 물방울이 맑아지면서 원래 색으로 */
  #photo-bubbles .bubble:hover img {
    filter: none;
    opacity: 1;
    transform: scale(1);
  }
  #photo-bubbles figcaption {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: calc(100% + 0.6rem);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 0.85rem;
    padding: 0.25rem 0.7rem;
    border-radius: 0.5rem;
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #photo-bubbles .bubble:hover figcaption { opacity: 1; }
</style>

<script>
  (function () {
    var box = document.getElementById('photo-bubbles');
    if (!box) return;
    /* fixed 위치가 테마의 transform 영향을 받지 않도록 body 바로 아래로 옮김 */
    document.body.appendChild(box);
    document.body.classList.add('has-bubbles');

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var items = [], W = 0, H = 0, BX = 0, BY = 0, placed = false, last = 0;
    var OBSTACLE_SEL = '#post-list .post-preview, .pagination, #panel-wrapper .access > section';
    var GAP = 14;

    function fitBox() {
      var sb = document.getElementById('sidebar');
      var tb = document.getElementById('topbar-wrapper');
      var left = sb ? Math.max(0, sb.getBoundingClientRect().right) : 0;
      var top = tb ? Math.max(0, tb.getBoundingClientRect().bottom) : 0;
      box.style.left = left + 'px';
      box.style.top = top + 'px';
      var br = box.getBoundingClientRect();
      BX = br.left; BY = br.top; W = br.width; H = br.height;
    }

    /* 글 카드·오른쪽 패널을 버블이 피해 다닐 벽으로 */
    function obstacles() {
      var out = [];
      var els = document.querySelectorAll(OBSTACLE_SEL);
      for (var i = 0; i < els.length; i++) {
        var r = els[i].getBoundingClientRect();
        if (r.width < 4 || r.height < 4) continue;
        var o = { l: r.left - BX - GAP, t: r.top - BY - GAP, r: r.right - BX + GAP, b: r.bottom - BY + GAP };
        if (o.b < 0 || o.t > H || o.r < 0 || o.l > W) continue;
        out.push(o);
      }
      return out;
    }

    function freeArea(obs) {
      var covered = 0;
      obs.forEach(function (o) {
        var w = Math.max(0, Math.min(W, o.r) - Math.max(0, o.l));
        var h = Math.max(0, Math.min(H, o.b) - Math.max(0, o.t));
        covered += w * h;
      });
      return Math.max(W * H * 0.2, W * H - covered);
    }

    function sizes() {
      var n = items.length;
      /* 빈 공간의 약 40%를 버블이 차지하도록 */
      var base = 2 * Math.sqrt((0.4 * freeArea(obstacles())) / (n * Math.PI));
      var maxS = Math.min(W, H) * 0.42;
      items.forEach(function (it) {
        var s = it.fixed || base * it.f;
        it.s0 = Math.max(70, Math.min(s, maxS));
        setSize(it);
      });
    }

    function setSize(it) {
      var s = it.s0 * it.k;
      if (Math.abs(s - (it.shownSize || 0)) > 0.5) {
        it.el.style.width = it.el.style.height = s + 'px';
        it.shownSize = s;
      }
      it.r = s / 2;
      it.m = s * s;
    }

    function hitsAny(it, obs) {
      for (var i = 0; i < obs.length; i++) {
        var o = obs[i];
        var cx = Math.max(o.l, Math.min(it.x, o.r)), cy = Math.max(o.t, Math.min(it.y, o.b));
        var dx = it.x - cx, dy = it.y - cy;
        if (dx * dx + dy * dy < it.r * it.r - 1) return true;
      }
      return false;
    }

    function relayout() {
      fitBox();
      if (W < 80 || H < 80) return;
      sizes();
      var obs = obstacles();
      items.forEach(function (it) {
        if (!placed) {
          /* 처음엔 벽과 안 겹치는 자리를 골라서 놓기 */
          for (var t = 0; t < 60; t++) {
            it.x = it.r + Math.random() * Math.max(1, W - 2 * it.r);
            it.y = it.r + Math.random() * Math.max(1, H - 2 * it.r);
            if (!hitsAny(it, obs)) break;
          }
        }
        it.x = Math.min(Math.max(it.x, it.r), Math.max(it.r, W - it.r));
        it.y = Math.min(Math.max(it.y, it.r), Math.max(it.r, H - it.r));
      });
      placed = true;
      draw();
    }

    function draw() {
      items.forEach(function (it) {
        if (!it.shown && it.img && it.img.complete && it.img.naturalWidth) {
          it.shown = true;
          it.el.classList.add('ready');
        }
        it.el.style.transform = 'translate(' + (it.x - it.r) + 'px,' + (it.y - it.r) + 'px)';
      });
    }

    /* 원과 사각형 충돌: 밀어내고 법선 방향으로 튕기기 */
    function bounceOff(a, o) {
      var cx = Math.max(o.l, Math.min(a.x, o.r)), cy = Math.max(o.t, Math.min(a.y, o.b));
      var dx = a.x - cx, dy = a.y - cy, d2 = dx * dx + dy * dy;
      if (d2 >= a.r * a.r) return false;
      var nx, ny, push;
      if (d2 < 1e-6) {
        /* 중심이 사각형 안: 가장 가까운 변으로 내보내기 */
        var dl = a.x - o.l, dr = o.r - a.x, dt = a.y - o.t, db = o.b - a.y;
        var m = Math.min(dl, dr, dt, db);
        if (m === dl) { nx = -1; ny = 0; push = dl + a.r; }
        else if (m === dr) { nx = 1; ny = 0; push = dr + a.r; }
        else if (m === dt) { nx = 0; ny = -1; push = dt + a.r; }
        else { nx = 0; ny = 1; push = db + a.r; }
      } else {
        var d = Math.sqrt(d2);
        nx = dx / d; ny = dy / d; push = a.r - d;
      }
      a.x += nx * push; a.y += ny * push;
      var vn = a.vx * nx + a.vy * ny;
      if (vn < 0) { a.vx -= 2 * vn * nx; a.vy -= 2 * vn * ny; }
      return true;
    }

    function step(now) {
      var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
      last = now;
      if (placed && W > 80) {
        var obs = obstacles();
        items.forEach(function (a) {
          if (a.paused) return;
          var sp = Math.sqrt(a.vx * a.vx + a.vy * a.vy) || 1;
          var k = sp < 90 ? 90 / sp : sp > 220 ? 220 / sp : 1;
          a.vx *= k; a.vy *= k;
          a.x += a.vx * dt; a.y += a.vy * dt;
        });
        /* 버블끼리 부딪히면 당구공처럼 튕겨나감 (크기에 따라 무게 다름) */
        for (var i = 0; i < items.length; i++) {
          for (var j = i + 1; j < items.length; j++) {
            var p = items[i], q = items[j];
            var dx = q.x - p.x, dy = q.y - p.y;
            var d = Math.sqrt(dx * dx + dy * dy) || 0.01, min = p.r + q.r;
            if (d >= min) continue;
            var nx = dx / d, ny = dy / d, overlap = min - d;
            var mp = p.paused ? 1e9 : p.m, mq = q.paused ? 1e9 : q.m;
            p.x -= nx * overlap * mq / (mp + mq); p.y -= ny * overlap * mq / (mp + mq);
            q.x += nx * overlap * mp / (mp + mq); q.y += ny * overlap * mp / (mp + mq);
            var rel = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
            if (rel < 0) {
              var imp = -2 * rel / (1 / mp + 1 / mq);
              if (!p.paused) { p.vx -= imp / mp * nx; p.vy -= imp / mp * ny; }
              if (!q.paused) { q.vx += imp / mq * nx; q.vy += imp / mq * ny; }
            }
          }
        }
        items.forEach(function (a) {
          /* 글 카드에 부딪히면 튕겨나감 */
          for (var t = 0; t < 2; t++) obs.forEach(function (o) { bounceOff(a, o); });
          /* 화면 가장자리 */
          if (a.x < a.r) { a.x = a.r; a.vx = Math.abs(a.vx); }
          if (a.x > W - a.r) { a.x = W - a.r; a.vx = -Math.abs(a.vx); }
          if (a.y < a.r) { a.y = a.r; a.vy = Math.abs(a.vy); }
          if (a.y > H - a.r) { a.y = H - a.r; a.vy = -Math.abs(a.vy); }
          /* 좁은 틈에 끼면 몸을 줄이고, 넓은 데로 나오면 천천히 원래 크기로 */
          if (hitsAny(a, obs)) a.k = Math.max(0.3, a.k - 1.5 * dt);
          else if (a.k < 1) {
            var save = a.k;
            a.k = Math.min(1, a.k + 0.35 * dt);
            setSize(a);
            if (hitsAny(a, obs)) a.k = save;
          }
          setSize(a);
        });
        draw();
      }
      requestAnimationFrame(step);
    }

    function start() {
      var els = Array.prototype.slice.call(box.querySelectorAll('.bubble'));
      if (!els.length) { box.remove(); document.body.classList.remove('has-bubbles'); return; }
      items = els.map(function (el) {
        var ang = Math.random() * Math.PI * 2, sp = 110 + Math.random() * 90;
        var it = {
          el: el, fixed: parseInt(el.getAttribute('data-diameter'), 10) || 0,
          f: 0.8 + Math.random() * 0.4, k: 1, s0: 100, r: 1, m: 1, x: 0, y: 0,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, paused: false,
          img: el.querySelector('img'), shown: false
        };
        el.addEventListener('mouseenter', function () { it.paused = true; });
        el.addEventListener('mouseleave', function () { it.paused = false; });
        return it;
      });
      relayout();
      if (window.ResizeObserver) new ResizeObserver(relayout).observe(box);
      window.addEventListener('resize', relayout);
      window.addEventListener('load', relayout);
      if (!reduce) requestAnimationFrame(step);
      /* 사진 로딩 확인이 늦어져도 3초 뒤엔 무조건 보이게 */
      setTimeout(function () { items.forEach(function (it) { it.shown = true; it.el.classList.add('ready'); }); }, 3000);
      setInterval(draw, 500);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
</script>
{%- endif -%}
