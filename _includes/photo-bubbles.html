<!-- 홈 상단: 활동 사진 버블 (사진 목록은 _data/bubbles.yml) -->
{%- assign bubbles = site.data.bubbles -%}
{%- if bubbles and bubbles.size > 0 -%}
<section id="photo-bubbles" aria-label="활동 사진">
  {%- for b in bubbles -%}
    {%- capture src -%}{% include media-url.html src=b.src %}{%- endcapture -%}
    <figure class="bubble" data-size="{{ b.size | default: '' }}">
      <img src="{{ src | strip }}" alt="{{ b.caption | default: '활동 사진' | escape }}" loading="lazy" onerror="this.closest('.bubble').remove()">
      {%- if b.caption -%}<figcaption>{{ b.caption }}</figcaption>{%- endif -%}
    </figure>
  {%- endfor -%}
</section>

<style>
  #photo-bubbles {
    position: relative;
    height: 440px;
    margin: 0 0 1.5rem;
    border-radius: 1rem;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(63, 185, 80, 0.10), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(88, 166, 255, 0.10), transparent 45%),
      var(--card-bg, transparent);
    border: 1px solid var(--card-border-color, rgba(128, 128, 128, 0.2));
  }
  #photo-bubbles .bubble {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    border-radius: 50%;
    overflow: visible;
    cursor: pointer;
    will-change: transform;
    transition: width 0.25s ease, height 0.25s ease;
  }
  #photo-bubbles .bubble img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.25);
    transition: transform 0.25s ease;
  }
  #photo-bubbles .bubble:hover { z-index: 5; }
  #photo-bubbles .bubble:hover img { transform: scale(1.2); }
  #photo-bubbles figcaption {
    position: absolute;
    left: 50%;
    top: calc(100% + 0.75rem);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 0.8rem;
    padding: 0.2rem 0.6rem;
    border-radius: 0.5rem;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #photo-bubbles .bubble:hover figcaption { opacity: 1; }
  @media (max-width: 576px) {
    #photo-bubbles { height: 320px; }
  }
</style>

<script>
  (function () {
    var box = document.getElementById('photo-bubbles');
    if (!box) return;
    var els = Array.prototype.slice.call(box.querySelectorAll('.bubble'));
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var W = 0, H = 0, items = [];

    function measure() { W = box.clientWidth; H = box.clientHeight; }

    function init() {
      measure();
      var small = W < 576;
      /* 사진 개수에 맞춰 버블 크기를 정해서 영역의 약 55%를 채우기 */
      var n = els.length;
      var base = 2 * Math.sqrt((0.55 * W * H) / (n * Math.PI));
      var maxS = Math.min(H * 0.9, W * 0.45);
      base = Math.min(base, maxS);
      items = els.map(function (el) {
        var s = parseInt(el.getAttribute('data-size'), 10);
        var fixed = s || 0, f = 0.85 + Math.random() * 0.3;
        if (!s) s = base * f;
        else if (small) s = s * 0.7;
        s = Math.min(s, maxS);
        el.style.width = el.style.height = s + 'px';
        var r = s / 2;
        var ang = Math.random() * Math.PI * 2;
        var sp = 0.25 + Math.random() * 0.35;
        return {
          el: el, r: r, f: f, fixed: fixed,
          x: r + Math.random() * Math.max(1, W - 2 * r),
          y: r + Math.random() * Math.max(1, H - 2 * r),
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          paused: false, t: Math.random() * 1000
        };
      });
      items.forEach(function (it) {
        it.el.addEventListener('mouseenter', function () { it.paused = true; });
        it.el.addEventListener('mouseleave', function () { it.paused = false; });
      });
      draw();
    }

    function draw() {
      items.forEach(function (it) {
        var bob = reduce ? 0 : Math.sin(it.t / 60) * 3;
        it.el.style.transform = 'translate(' + (it.x - it.r) + 'px,' + (it.y - it.r + bob) + 'px)';
      });
    }

    function step() {
      for (var i = 0; i < items.length; i++) {
        var a = items[i];
        a.t++;
        if (a.paused) continue;
        var sp = Math.sqrt(a.vx * a.vx + a.vy * a.vy) || 0.01;
        var k = sp < 0.2 ? 0.2 / sp : sp > 0.7 ? 0.7 / sp : 1;
        a.vx *= k; a.vy *= k;
        a.x += a.vx; a.y += a.vy;
        if (a.x < a.r) { a.x = a.r; a.vx = Math.abs(a.vx); }
        if (a.x > W - a.r) { a.x = W - a.r; a.vx = -Math.abs(a.vx); }
        if (a.y < a.r) { a.y = a.r; a.vy = Math.abs(a.vy); }
        if (a.y > H - a.r) { a.y = H - a.r; a.vy = -Math.abs(a.vy); }
      }
      /* 버블끼리 부딪히면 살짝 튕겨나가기 */
      for (var i = 0; i < items.length; i++) {
        for (var j = i + 1; j < items.length; j++) {
          var p = items[i], q = items[j];
          var dx = q.x - p.x, dy = q.y - p.y;
          var d = Math.sqrt(dx * dx + dy * dy) || 0.01, min = p.r + q.r;
          if (d < min) {
            var nx = dx / d, ny = dy / d, push = (min - d) / 2;
            if (!p.paused) { p.x -= nx * push; p.y -= ny * push; }
            if (!q.paused) { q.x += nx * push; q.y += ny * push; }
            var rel = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
            if (rel < 0) {
              p.vx += rel * nx; p.vy += rel * ny;
              q.vx -= rel * nx; q.vy -= rel * ny;
            }
          }
        }
      }
      draw();
      requestAnimationFrame(step);
    }

    function start() {
      els = Array.prototype.slice.call(box.querySelectorAll('.bubble'));
      if (!els.length) { box.remove(); return; }
      init();
      if (!reduce) requestAnimationFrame(step);
      window.addEventListener('resize', function () {
        measure();
        var small = W < 576;
        var base = Math.min(2 * Math.sqrt((0.55 * W * H) / (items.length * Math.PI)), H * 0.9, W * 0.45);
        items.forEach(function (it) {
          var s = it.fixed ? (small ? it.fixed * 0.7 : it.fixed) : base * it.f;
          s = Math.min(s, H * 0.9, W * 0.45);
          it.el.style.width = it.el.style.height = s + 'px';
          it.r = s / 2;
          it.x = Math.min(Math.max(it.x, it.r), Math.max(it.r, W - it.r));
          it.y = Math.min(Math.max(it.y, it.r), Math.max(it.r, H - it.r));
        });
        draw();
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
</script>
{%- endif -%}
