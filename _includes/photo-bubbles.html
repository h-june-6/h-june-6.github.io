<!-- 홈 배경: 활동 사진 버블 (사진 목록은 _data/bubbles.yml) -->
{%- assign bubbles = site.data.bubbles -%}
{%- if bubbles and bubbles.size > 0 -%}
<section id="photo-bubbles" aria-label="활동 사진">
  {%- for b in bubbles -%}
    {%- capture src -%}{% include media-url.html src=b.src %}{%- endcapture -%}
    <figure class="bubble" data-diameter="{{ b.diameter }}">
      <img src="{{ src | strip }}" alt="{{ b.caption | default: '활동 사진' | escape }}" loading="eager" onerror="this.closest('.bubble').remove()">
      {%- if b.caption -%}<figcaption>{{ b.caption }}</figcaption>{%- endif -%}
    </figure>
  {%- endfor -%}
</section>
<div id="bubble-hero">
  <button type="button" id="bubble-scroll" aria-label="글 목록으로 내려가기">
    <svg viewBox="0 0 168 68" width="168" height="68" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <linearGradient id="chev-body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8f3ff" stop-opacity="0.95"/>
          <stop offset="0.55" stop-color="#8fbcef" stop-opacity="0.85"/>
          <stop offset="1" stop-color="#4a7fc4" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="chev-shine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset="0.3" stop-color="#fff" stop-opacity="0.9"/>
          <stop offset="0.5" stop-color="#fff" stop-opacity="0.2"/>
          <stop offset="0.75" stop-color="#fff" stop-opacity="0.7"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g class="chev c1"><path class="under" d="M8 8 L84 26 L160 8" stroke-width="9"/><path d="M8 8 L84 26 L160 8" stroke="url(#chev-body)" stroke-width="5"/><path d="M14 7.2 L84 23.6 L154 7.2" stroke="url(#chev-shine)" stroke-width="1.4"/></g>
      <g class="chev c2"><path class="under" d="M8 24 L84 42 L160 24" stroke-width="9"/><path d="M8 24 L84 42 L160 24" stroke="url(#chev-body)" stroke-width="5"/><path d="M14 23.2 L84 39.6 L154 23.2" stroke="url(#chev-shine)" stroke-width="1.4"/></g>
      <g class="chev c3"><path class="under" d="M8 40 L84 58 L160 40" stroke-width="9"/><path d="M8 40 L84 58 L160 40" stroke="url(#chev-body)" stroke-width="5"/><path d="M14 39.2 L84 55.6 L154 39.2" stroke="url(#chev-shine)" stroke-width="1.4"/></g>
    </svg>
    <span class="scroll-label">Scroll</span>
  </button>
</div>

<style>
  /* 버블 층: 사이드바 오른쪽, 상단바 아래의 화면 전체를 씀 */
  #photo-bubbles {
    position: fixed;
    top: 3rem;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  /* 글 목록·상단바·오른쪽 패널만 버블 위에, 푸터 글씨는 버블 뒤로 */
  body.has-bubbles #topbar-wrapper,
  body.has-bubbles #post-list,
  body.has-bubbles .pagination { position: relative; z-index: 1; }
  body.has-bubbles #panel-wrapper { z-index: 1; transition: opacity 0.15s linear; }

  /* 처음 화면: 버블만 보이는 첫 화면, 글 목록은 그 아래에서 시작 */
  #bubble-hero {
    position: relative;
    z-index: 2;
    height: calc(100vh - 3rem);
    height: calc(100svh - 3rem);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 2.5rem;
    pointer-events: none;
  }
  /* 물방울 느낌의 겹친 화살표 3개 */
  #bubble-scroll {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    padding: 0.5rem 1rem;
    border: 0;
    background: none;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  #bubble-scroll svg {
    overflow: visible;
    filter: drop-shadow(0 2px 3px rgba(30, 60, 110, 0.35)) drop-shadow(0 0 6px rgba(140, 190, 245, 0.35));
  }
  #bubble-scroll .under { stroke: rgba(8, 16, 32, 0.55); }
  [data-bs-theme='light'] #bubble-scroll .under { stroke: rgba(255, 255, 255, 0.75); }
  #bubble-scroll .chev { animation: chev-wave 1.8s ease-in-out infinite; opacity: 0.25; }
  #bubble-scroll .c2 { animation-delay: 0.2s; }
  #bubble-scroll .c3 { animation-delay: 0.4s; }
  @keyframes chev-wave {
    0%, 100% { opacity: 0.25; transform: translateY(-2px); }
    45% { opacity: 1; transform: translateY(3px); }
  }
  #bubble-scroll .scroll-label {
    font-size: 0.9rem;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    letter-spacing: 0.18em;
    color: var(--text-muted-color, #8a94a6);
  }
  #bubble-scroll:hover .chev { animation-duration: 1.1s; }
  @media (prefers-reduced-motion: reduce) { #bubble-scroll .chev { animation: none; opacity: 0.85; } }

  #photo-bubbles .bubble {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    border-radius: 50%;
    pointer-events: auto;
    cursor: pointer;
    will-change: transform;
    opacity: 0;
  }
  /* 사진이 다 불러와진 뒤에 부드럽게 나타나기 */
  #photo-bubbles .bubble.ready { opacity: 1; transition: opacity 0.5s ease, box-shadow 0.3s ease; }
  #photo-bubbles .preview-img,
  #photo-bubbles .shimmer {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    background: none !important;
    border-radius: 50%;
    overflow: hidden;
    -webkit-clip-path: circle(50% at 50% 50%);
    clip-path: circle(50% at 50% 50%);
  }
  #photo-bubbles .shimmer::before { display: none !important; }
  #photo-bubbles .bubble img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
    -webkit-clip-path: circle(50% at 50% 50%);
    clip-path: circle(50% at 50% 50%);
  }
  /* 물방울 그림자: 아래로 옅게 */
  #photo-bubbles .bubble {
    box-shadow: 0 18px 32px -18px rgba(30, 60, 110, 0.35);
  }
  /* 사진: 색감을 살짝 바래게, 물속에 비친 것처럼 */
  #photo-bubbles .bubble > .preview-img { position: relative; z-index: 1; }
  #photo-bubbles .bubble img {
    filter: saturate(0.75) brightness(0.9) contrast(0.95);
    opacity: 1;
    transform: scale(1.06);
    transition: filter 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
  }
  /* 물방울 표면: 광택 + 렌즈처럼 밝은 가장자리 */
  #photo-bubbles .bubble::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 24% 13% at 33% 19%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0) 70%),
      radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 10%),
      radial-gradient(circle closest-side, rgba(255, 255, 255, 0) 74%, rgba(190, 215, 245, 0.1) 90%, rgba(255, 255, 255, 0.22) 100%);
    box-shadow:
      inset 0 -14px 28px rgba(40, 90, 160, 0.22),
      inset 0 10px 22px rgba(255, 255, 255, 0.15),
      0 0 0 1px rgba(255, 255, 255, 0.6);
  }
  #photo-bubbles.tidy .bubble { pointer-events: none; }
  #photo-bubbles .bubble:hover { z-index: 5; }
  /* 마우스를 올리면 물방울이 맑아지면서 원래 색으로 */
  #photo-bubbles .bubble:hover img {
    filter: none;
    opacity: 1;
    transform: scale(1);
  }
  #photo-bubbles figcaption {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: calc(100% + 0.6rem);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 0.85rem;
    padding: 0.25rem 0.7rem;
    border-radius: 0.5rem;
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #photo-bubbles .bubble:hover figcaption { opacity: 1; }
</style>

<script>
  (function () {
    var box = document.getElementById('photo-bubbles');
    if (!box) return;
    /* fixed 위치가 테마의 transform 영향을 받지 않도록 body 바로 아래로 옮김 */
    document.body.appendChild(box);
    document.body.classList.add('has-bubbles');

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var items = [], W = 0, H = 0, placed = false, last = 0;
    var hero = document.getElementById('bubble-hero');
    var arrow = document.getElementById('bubble-scroll');
    var prog = 0;
    var panel = document.getElementById('panel-wrapper');

    function onScroll() {
      var h = hero ? hero.offsetHeight : window.innerHeight;
      prog = Math.max(0, Math.min(1, window.scrollY / (h * 0.7)));
      box.style.opacity = String(1 - prog);
      box.style.visibility = prog >= 1 ? 'hidden' : 'visible';
      box.classList.toggle('tidy', prog > 0.5);
      panel = panel || document.getElementById('panel-wrapper');
      if (panel) {
        panel.style.opacity = String(prog);
        panel.style.pointerEvents = prog > 0.5 ? 'auto' : 'none';
      }
      if (arrow) {
        arrow.style.opacity = String(Math.max(0, 1 - prog * 2.5));
        arrow.style.pointerEvents = prog > 0.3 ? 'none' : 'auto';
      }
      draw();
    }

    function fitBox() {
      var sb = document.getElementById('sidebar');
      var tb = document.getElementById('topbar-wrapper');
      var left = sb ? Math.max(0, sb.getBoundingClientRect().right) : 0;
      var top = tb ? Math.max(0, tb.getBoundingClientRect().bottom) : 0;
      box.style.left = left + 'px';
      box.style.top = top + 'px';
      W = box.clientWidth;
      H = box.clientHeight;
    }

    function sizes() {
      var n = items.length;
      /* 버블들이 화면의 약 35%를 차지하게 해서 돌아다닐 공간을 남김 */
      var base = 2 * Math.sqrt((0.35 * W * H) / (n * Math.PI));
      var maxS = Math.min(W, H) * 0.42;
      items.forEach(function (it) {
        var s = it.fixed || base * it.f;
        s = Math.max(60, Math.min(s, maxS));
        it.el.style.width = it.el.style.height = s + 'px';
        it.r = s / 2;
        it.m = s * s;
      });
    }

    function relayout() {
      fitBox();
      if (W < 80 || H < 80) return;
      sizes();
      items.forEach(function (it) {
        if (!placed) {
          it.x = it.r + Math.random() * Math.max(1, W - 2 * it.r);
          it.y = it.r + Math.random() * Math.max(1, H - 2 * it.r);
        }
        it.x = Math.min(Math.max(it.x, it.r), Math.max(it.r, W - it.r));
        it.y = Math.min(Math.max(it.y, it.r), Math.max(it.r, H - it.r));
      });
      placed = true;
      draw();
    }

    function draw() {
      items.forEach(function (it) {
        if (!it.shown && it.img && it.img.complete && it.img.naturalWidth) {
          it.shown = true;
          it.el.classList.add('ready');
        }
        var sc = 1 - 0.55 * prog, lift = -80 * prog * (0.6 + it.f * 0.5);
        it.el.style.transform = 'translate(' + (it.x - it.r) + 'px,' + (it.y - it.r + lift) + 'px) scale(' + sc + ')';
      });
    }

    /* 화살표 주변은 버블이 들어오지 않게 튕겨내기 */
    function pushOut(a, o) {
      var cx = Math.max(o.l, Math.min(a.x, o.r)), cy = Math.max(o.t, Math.min(a.y, o.b));
      var dx = a.x - cx, dy = a.y - cy, d2 = dx * dx + dy * dy;
      if (d2 >= a.r * a.r) return;
      var nx, ny, push;
      if (d2 < 1e-6) { nx = 0; ny = -1; push = a.y - o.t + a.r; }
      else { var d = Math.sqrt(d2); nx = dx / d; ny = dy / d; push = a.r - d; }
      a.x += nx * push; a.y += ny * push;
      var vn = a.vx * nx + a.vy * ny;
      if (vn < 0) { a.vx -= 2 * vn * nx; a.vy -= 2 * vn * ny; }
    }

    function step(now) {
      var arrowBox = null;
      if (arrow && prog < 0.4) {
        var ar = arrow.getBoundingClientRect(), br = box.getBoundingClientRect();
        if (ar.width) arrowBox = { l: ar.left - br.left - 24, t: ar.top - br.top - 24, r: ar.right - br.left + 24, b: ar.bottom - br.top + 24 };
      }
      var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
      last = now;
      if (placed && prog < 1) {
        items.forEach(function (a) {
          if (a.paused) return;
          var sp = Math.sqrt(a.vx * a.vx + a.vy * a.vy) || 1;
          var k = sp < 90 ? 90 / sp : sp > 220 ? 220 / sp : 1;
          a.vx *= k; a.vy *= k;
          a.x += a.vx * dt; a.y += a.vy * dt;
          if (a.x < a.r) { a.x = a.r; a.vx = Math.abs(a.vx); }
          if (a.x > W - a.r) { a.x = W - a.r; a.vx = -Math.abs(a.vx); }
          if (a.y < a.r) { a.y = a.r; a.vy = Math.abs(a.vy); }
          if (a.y > H - a.r) { a.y = H - a.r; a.vy = -Math.abs(a.vy); }
          if (arrowBox) pushOut(a, arrowBox);
        });
        /* 버블끼리 부딪히면 당구공처럼 튕겨나감 (크기에 따라 무게 다름) */
        for (var i = 0; i < items.length; i++) {
          for (var j = i + 1; j < items.length; j++) {
            var p = items[i], q = items[j];
            var dx = q.x - p.x, dy = q.y - p.y;
            var d = Math.sqrt(dx * dx + dy * dy) || 0.01, min = p.r + q.r;
            if (d >= min) continue;
            var nx = dx / d, ny = dy / d, overlap = min - d;
            var mp = p.paused ? 1e9 : p.m, mq = q.paused ? 1e9 : q.m;
            p.x -= nx * overlap * mq / (mp + mq); p.y -= ny * overlap * mq / (mp + mq);
            q.x += nx * overlap * mp / (mp + mq); q.y += ny * overlap * mp / (mp + mq);
            var rel = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
            if (rel < 0) {
              var imp = -2 * rel / (1 / mp + 1 / mq);
              if (!p.paused) { p.vx -= imp / mp * nx; p.vy -= imp / mp * ny; }
              if (!q.paused) { q.vx += imp / mq * nx; q.vy += imp / mq * ny; }
            }
          }
        }
        draw();
      }
      requestAnimationFrame(step);
    }

    function start() {
      var els = Array.prototype.slice.call(box.querySelectorAll('.bubble'));
      if (!els.length) { box.remove(); document.body.classList.remove('has-bubbles'); return; }
      items = els.map(function (el) {
        var ang = Math.random() * Math.PI * 2, sp = 110 + Math.random() * 90;
        var it = {
          el: el, fixed: parseInt(el.getAttribute('data-diameter'), 10) || 0,
          f: 0.8 + Math.random() * 0.4, r: 1, m: 1, x: 0, y: 0,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, paused: false,
          img: el.querySelector('img'), shown: false
        };
        el.addEventListener('mouseenter', function () { it.paused = true; });
        el.addEventListener('mouseleave', function () { it.paused = false; });
        return it;
      });
      relayout();
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
      if (arrow) arrow.addEventListener('click', function () {
        var list = document.getElementById('post-list');
        if (list) list.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      });
      if (window.ResizeObserver) new ResizeObserver(relayout).observe(box);
      window.addEventListener('resize', relayout);
      window.addEventListener('load', relayout);
      if (!reduce) requestAnimationFrame(step);
      /* 사진 로딩 확인이 늦어져도 3초 뒤엔 무조건 보이게 */
      setTimeout(function () { items.forEach(function (it) { it.shown = true; it.el.classList.add('ready'); }); }, 3000);
      setInterval(draw, 500);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
</script>
{%- endif -%}
